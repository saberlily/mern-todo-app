# Cấu hình toàn cục chung cho tất cả các tiến trình thu thập (scrape)
global:
  scrape_interval: 5s      
  evaluation_interval: 5s  
  # scrape_timeout: 10s   

# Cấu hình Alertmanager để gửi cảnh báo
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Cấu hình danh sách các target cần thu thập metric
scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 1m
    static_configs:
      - targets: ['localhost:9090']
      
  - job_name: 'mern-todo-app'
    static_configs:
      - targets: ['157.245.55.61:9100']

  - job_name: 'mongodb'
    scrape_interval: 5s
    static_configs:
      - targets: ['mongodb-exporter:9216']
