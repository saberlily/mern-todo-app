global:
  scrape_interval: 15s      
  evaluation_interval: 15s  
  # scrape_timeout: 10s   

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"


scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
      
  - job_name: 'mern-todo-app'
    static_configs:
      - targets: ['178.128.211.2:9100']

  - job_name: 'mongodb'
    scrape_interval: 15s
    static_configs:
      - targets: ['mongodb-exporter:9216']
